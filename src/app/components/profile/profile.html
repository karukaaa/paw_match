<section class="profile-page">
  <h2>Your Profile</h2>

  @if (user$ | async; as user) {
  <div class="profile-card">
    <div class="info-block">
      <label>Email</label>
      <p>{{ user.email }}</p>
    </div>

    <div class="info-block">
      <label>User ID (UID)</label>
      <p>{{ user.uid }}</p>
    </div>

    @if (user.photoURL) {
    <img [src]="user.photoURL" alt="Profile Photo" class="profile-photo" />
    }

    <p class="note">You can view your favorite articles any time!</p>

    <button class="btn primary" (click)="goToFavorites()">View Favorites</button>
  </div>

  } @else {
  <p>You are not logged in.</p>
  }
</section>
