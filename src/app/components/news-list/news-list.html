<section class="news-page">
  <h2>News</h2>

  <div class="toolbar">
    <input
      type="search"
      class="search-input"
      placeholder="Search articles..."
      [value]="query()"
      (input)="onInput($event)"
    />

    <button type="button" class="reset-btn" (click)="refresh()">Reset</button>
    <p>10 news articles are displayed</p>
  </div>

  <!-- TOP Pagination -->
  <div class="pagination" *ngIf="totalHits() > 0">
    <button type="button" (click)="goToPage(page() - 1)" [disabled]="page() === 0">‹ Prev</button>
    <span>Page {{ page() }}</span>
    <button
      type="button"
      (click)="goToPage(page() + 1)"
      [disabled]="(page() + 1) * 10 >= totalHits()"
    >
      Next ›
    </button>
  </div>

  <!-- Loading -->
  <div *ngIf="loading()" class="state">Loading news...</div>
  <div *ngIf="error()" class="state error">{{ error() }}</div>

  <!-- List -->
  <div class="news-list" *ngIf="!loading() && !error()">
    <app-news-card *ngFor="let article of news()" [article]="article"></app-news-card>

    <p *ngIf="news().length === 0">No articles found for this query.</p>
  </div>

  <!-- Bottom Pagination -->
  <div class="pagination" *ngIf="totalHits() > 0">
    <button type="button" (click)="goToPage(page() - 1)" [disabled]="page() === 0">‹ Prev</button>
    <span>Page {{ page() }}</span>
    <button
      type="button"
      (click)="goToPage(page() + 1)"
      [disabled]="(page() + 1) * 10 >= totalHits()"
    >
      Next ›
    </button>
  </div>
</section>
